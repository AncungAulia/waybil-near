name: CI

on:
  # Design files, docs and Markdown are not checked by any job, so changes that
  # only touch them skip CI. A change that also touches code still runs everything.
  pull_request:
    paths-ignore:
      - "design/**"
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "design/**"
      - "docs/**"
      - "**/*.md"

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check

  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract: [mock-usdc, waybil]
    defaults:
      run:
        working-directory: contracts/${{ matrix.contract }}
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-near
        # Pinned so the generated ABI matches the committed one.
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/${{ matrix.contract }}
      - run: cargo fmt --check
      - run: cargo clippy --target wasm32-unknown-unknown --lib -- -D warnings
      - name: Unit and sandbox tests
        run: cargo test
      - name: ABI is up to date
        run: |
          cargo near abi
          file=$(echo ${{ matrix.contract }} | tr - _)_abi.json
          if ! diff -u abi/${{ matrix.contract }}.json target/near/$file; then
            echo "The ABI is out of date. Run pnpm --filter @waybil/scripts abi and commit the result."
            exit 1
          fi
